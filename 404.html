<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Intensify Technologies</title>
    <!--
      Single-Page-App fallback for GitHub Pages (project subpath).
      Converts the requested deep-link path into a query string and redirects
      to the app's index, which restores the real URL (see index.html).
      Technique: rafgraph/spa-github-pages. pathSegmentsToKeep = 1 → "/intensify/".
    -->
    <script>
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
          "/?/" +
          l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
